services:
  app:
    # image跟build並存：本機/CI用build:現場組image；未來真的有VM時，VM上只
    # 跑`docker compose pull && up -d`，靠這個image名稱拉CD推上去的GHCR image，
    # 不用在VM上重新build，同一份compose檔兩種用法都撐得住。
    image: ghcr.io/gary2376/weatherllm:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      # fastembed_cache深掛在/app/Data/fastembed_cache，故意不整個Data/掛進來——
      # 整個目錄掛volume會蓋掉Dockerfile build階段warmup進image layer的模型快取，
      # 讓每次container啟動都要重新連外網下載模型，跟image warmup的目的互相打架。
      # 只掛真正需要跨rebuild保留、且由host端collector腳本產生的資料檔。
      - ./Data/chroma:/app/Data/chroma
      - ./Data/travel.db:/app/Data/travel.db
      - ./Data/bm25_index.pkl:/app/Data/bm25_index.pkl
    env_file:
      - .env
    restart: unless-stopped
