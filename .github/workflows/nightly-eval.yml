name: Nightly Live Eval

# 這個 workflow 會真的呼叫 OpenAI API，花的是真錢——只設手動觸發
# (workflow_dispatch)，不排固定 cron schedule。要固定排程的話自己在這裡加
# schedule trigger，先確認能接受的花費金額再打開，不要預設幫你燒錢。
on:
  workflow_dispatch:

jobs:
  live-eval:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run intent-parsing accuracy eval (calls OpenAI, needs OPENAI_API_KEY secret)
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python eval/run_intent_eval.py
